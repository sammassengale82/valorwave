<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Karaoke Signup</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: sans-serif;
      padding: 20px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: none;
      font-size: 18px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      font-size: 20px;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Join the Karaoke Queue</h1>

  <form action="/submit" method="GET">
    <input name="name" placeholder="Your name" required />
    <textarea name="notes" placeholder="Notes (optional)"></textarea>
    <button type="submit">Join Queue</button>
  </form>
</body>
</html>
